spring.application.name=trip-service

server.port=${SERVER_PORT:8080}

spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5050}/${DB_NAME:Trip}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}

spring.jpa.hibernate.ddl-auto=validate

spring.liquibase.enabled=true
spring.liquibase.default-schema=public
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true


#GRPC
spring.grpc.client.channels.passenger-service.address=${PASSENGER_URL:localhost:9015}
spring.grpc.client.channels.driver-service.address=${DRIVER_URL:localhost:9016}


#CircuitBreaker
resilience4j.circuitbreaker.instances.passengerService.sliding-window-size=10
resilience4j.circuitbreaker.instances.passengerService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.passengerService.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.passengerService.failure-rate-threshold= 50
resilience4j.circuitbreaker.instances.driverService.sliding-window-size=10
resilience4j.circuitbreaker.instances.driverService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.driverService.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.driverService.failure-rate-threshold= 50

#KAFKA
spring.kafka.bootstrap-servers=${KAFKA_URL:localhost:9092}
kafka.topics.trip-completed=trip-completed-event
