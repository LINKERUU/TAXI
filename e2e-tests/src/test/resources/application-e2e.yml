spring:
  datasource:
    url: jdbc:tc:postgresql:15-alpine:///e2e_test_db
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  liquibase:
    enabled: false

server:
  port: 8083

logging:
  level:
    com.passengerservice: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG